<title>Healthspan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS-native. Large title that collapses into a translucent bar on scroll, inset grouped lists, two-state tab glyphs, sheets with grabbers. One token scale: radii 10 / 14 / pill, type 11 13 15 17 20 22 28 34. */
:root{
  --bg:#0D0D0D; --card:#1A1A1A; --card-2:#262626; --fill:rgba(255,255,255,.08); --fill-2:rgba(255,255,255,.15);
  --sep:rgba(255,255,255,.11); --label:#F2F2F2; --label-2:rgba(242,242,242,.66); --label-3:rgba(242,242,242,.38);
  --tint:#FF6A1F; --tint-2:#FF8C4D; --run:#34D399; --lift:#4C8DFF; --pt:#F0564F; --soc:#F5A524; --warn:#F5A524; --bad:#F0564F; --good:#34D399;
  --bar:rgba(13,13,13,.9); --on-tint:#1A0B03; --rec:#22D3EE; --bod:#FACC15;
  --r-ctl:10px; --r-card:14px; --r-pill:999px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font-r:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg)}
body{color:var(--label);font:17px/1.35 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
/* nav bar: invisible at the top, becomes the iOS collapsed bar on scroll */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:transparent;border-bottom:.5px solid transparent;transition:background-color .2s,border-color .2s}
.nav.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.nav-in{max-width:680px;margin:0 auto;height:44px;display:flex;align-items:center;justify-content:space-between;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-title{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s}
.nav.scrolled .nav-title{opacity:1}
.nav-btn{background:none;border:0;color:var(--tint);font-size:17px;padding:8px 0;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:4px}
.nav-btn svg{width:22px;height:22px}
.wrap{max-width:680px;margin:-44px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.large{font:700 30px/1.12 var(--font-d);letter-spacing:.01em;margin:0;min-height:44px;display:flex;align-items:center;padding-right:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--label-2);font-size:15px;margin:2px 0 16px}
.sec{margin-top:24px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px;gap:10px}
.sec-h h2{font:600 20px var(--font-d);margin:0;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sec-h .lnk{color:var(--tint);font-size:15px;background:none;border:0;cursor:pointer;padding:0 4px;min-height:44px;margin:-13px -4px;display:inline-flex;align-items:center;flex:none}
.cap{color:var(--label-2);font-size:13px;padding:0 16px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caprow{display:flex;justify-content:space-between;align-items:center;padding-top:20px}
.caprow .lnk{color:var(--tint);font-size:15px;text-transform:none;letter-spacing:0;background:none;border:0;cursor:pointer;min-height:44px;margin:-14px 0;padding:0}
.foot{color:var(--label-2);font-size:13px;padding:7px 16px 0;line-height:1.4}
.group{background:var(--card);border-radius:var(--r-card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;position:relative;width:100%;text-align:left;background:none;border:0}
.row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row.ind + .row::before,.group .row.ind-next::before{left:56px}
button.row{cursor:pointer}
button.row:active{background:var(--fill)}
.row .main{flex:1;min-width:0}
.row .t{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{flex:none;max-width:52%;overflow:hidden;text-overflow:ellipsis}
.wrapok .t,.wrapok .s{white-space:normal}
.info{width:24px;height:24px;border-radius:50%;border:0;background:var(--fill);color:var(--tint);font:700 14px/1 Georgia,"Times New Roman",serif;font-style:italic;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0}
.hero{padding:4px 4px 14px}
.hero .big{font:700 24px/1.2 var(--font-r);font-variant-numeric:tabular-nums}
.hero .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.steps{margin:0;padding:12px 16px 12px 36px;display:grid;gap:8px;font-size:17px;line-height:1.4}
.para{padding:12px 16px;font-size:17px;line-height:1.45;margin:0}
.ta{width:100%;min-height:150px;border:0;background:var(--card);border-radius:var(--r-card);padding:14px 16px;font:17px/1.4 var(--font);color:var(--label);resize:vertical}
.row .s{font-size:15px;color:var(--label-2);margin-top:1px}
.row .v{color:var(--label-2);font-size:17px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.group.reply .para{font-size:17px;line-height:1.45}
.thread{display:flex;flex-direction:column}
.msgs{display:grid;gap:12px;padding-bottom:12px}
.msg{display:grid;gap:3px;max-width:86%}
.msg.me{justify-self:end;text-align:right}
.msg .bub{display:inline-block;text-align:left;border:0;font:inherit;font-size:17px;line-height:1.35;padding:10px 14px;border-radius:18px;white-space:normal;word-break:break-word;color:var(--label);background:var(--card)}
.msg.me .bub{background:var(--tint);color:#fff;border-bottom-right-radius:6px;cursor:pointer}
.msg.coach .bub{border-bottom-left-radius:6px}
.msg.coach .bub.wait{color:var(--label-2);background:color-mix(in srgb,var(--card) 60%,transparent);border:1px dashed var(--sep)}
.msg .meta{font-size:12px;color:var(--label-2);padding:0 6px}
.msg .att-n{display:block;font-size:12px;opacity:.8;margin-top:4px}
.compose{position:sticky;bottom:0;background:var(--bg);padding-top:8px;margin:auto -4px 0}
.cbox{background:var(--card);border-radius:var(--r-card);padding:8px 10px 8px}
.cbox .ta{min-height:44px;background:transparent;padding:8px 6px}
.crow{display:flex;justify-content:space-between;align-items:center;padding-top:6px}
.crow .go{min-height:40px}.group.reply.wait .para{color:var(--label-2)}
.st{font-weight:600}.st.good{color:var(--good)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}.st.tint{color:var(--tint-2)}
.chev{width:8px;height:14px;flex:none;color:var(--label-3)}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:18px;height:18px}
.ico.run{background:var(--run)} .ico.lift{background:var(--lift)} .ico.soc{background:var(--soc)} .ico.rest{background:#5C6170} .ico.extra{background:var(--pt)} .ico.note{background:var(--tint)} .ico.rec{background:var(--rec);color:#000} .ico.bod{background:var(--bod);color:#000}
.btn-big{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:50px;border-radius:var(--r-card);border:0;background:var(--tint);color:var(--on-tint);font-weight:600;font-size:17px;cursor:pointer}
.btn-big.sec2{background:var(--fill);color:var(--tint)}
.btn-big:active{opacity:.8}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:var(--r-pill);background:var(--fill);color:var(--label-2);white-space:nowrap}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.pill.tint{color:var(--tint-2);background:color-mix(in srgb,var(--tint) 16%,transparent)}
.callout{background:var(--card);border-radius:var(--r-card);padding:14px 16px;display:grid;gap:6px}
.callout .h svg{width:16px;height:16px;color:var(--run)}
.callout .h{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--label-2);}
.callout p{margin:0;font-size:17px;line-height:1.4}
.feel{display:grid;gap:14px;padding:14px 16px}
.feel .q{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between}
.feel .q span{color:var(--label-2);font-weight:500}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale.s11{grid-template-columns:repeat(6,1fr)}
.scale button{min-height:44px;border-radius:var(--r-ctl);border:0;background:var(--fill);font-size:15px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:var(--r-ctl);padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;min-height:32px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--card-2);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:var(--r-pill);min-height:36px;min-width:50px;padding:0 14px;background:var(--fill);color:var(--label);font:600 15px var(--font);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
.sh:focus{outline:none}
button:focus:not(:focus-visible),input:focus:not(:focus-visible){outline:none}
.att{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.att .a{position:relative;aspect-ratio:1;border-radius:var(--r-ctl);overflow:hidden;background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--label-2);text-align:center;padding:6px}
.att img{width:100%;height:100%;object-fit:cover;max-width:100%}
.att .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;cursor:pointer}
.frow input[type=date]{min-height:34px}
.chart{background:var(--card);border-radius:var(--r-card);padding:14px 16px 10px}
.chart .k{font-size:13px;font-weight:600;color:var(--label-2);}
.chart .n{font:700 24px/1.2 var(--font-r);font-variant-numeric:tabular-nums;margin-top:2px}
.chart .n small{font-size:15px;color:var(--label-2);font-weight:500}
.chart .d{font-size:13px;color:var(--label-2);margin-bottom:6px}
.chart .take{font-size:15px;margin-top:6px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--label-2);font:21px var(--font)}
.empty{color:var(--label-2);font-size:15px;padding:14px 16px}
.up{color:var(--good)} .down{color:var(--bad)}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(2px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;color:#8A8F9C;font-size:10px;font-weight:500;letter-spacing:.01em;padding:3px 0 2px;cursor:pointer;display:grid;justify-items:center;gap:2px;min-height:49px;transition:color .15s}
.tab svg{width:28px;height:28px}
.tab svg .f{display:none}
.tab[aria-current="page"]{color:var(--tint);font-weight:600}
.tab[aria-current="page"] svg .o{display:none}
.tab[aria-current="page"] svg .f{display:block}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
/* sheets */
dialog{border:0;padding:0;background:var(--bg);color:var(--label);max-width:none;max-height:none}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog.sheet{margin:auto auto 0;width:100%;max-width:560px;border-radius:var(--r-card) var(--r-card) 0 0;max-height:92dvh;overflow:hidden}
dialog.sheet[open]{animation:shUp .18s cubic-bezier(.2,.8,.2,1)}
@keyframes shUp{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
dialog.full{margin:0;width:100%;height:100%;border-radius:0}
.sh{display:flex;flex-direction:column;max-height:92dvh}
dialog.sheet .sh::before{content:"";display:block;flex:none;width:36px;height:5px;border-radius:3px;background:var(--fill-2);margin:8px auto 0}
dialog.full .sh{height:100%;max-height:none}
.sh-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);flex:none}
dialog.sheet .sh-nav{padding-top:0;min-height:50px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.sh-nav .ttl{font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sh-nav .ttl small{display:block;font-weight:400;font-size:13px;color:var(--label-2);font-variant-numeric:tabular-nums}
.sh-nav .l{justify-self:start}.sh-nav .r{justify-self:end;font-weight:600}
.sh-body{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));flex:1;-webkit-overflow-scrolling:touch}
.frow{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 16px;position:relative}
.frow + .frow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.frow label{flex:1;font-size:17px}
.frow input,.frow select{flex:0 0 46%;text-align:right;border:0;background:none;color:var(--tint);font:17px var(--font);padding:8px 0;min-width:0}
.frow textarea{width:100%;border:0;background:none;color:var(--label);font:17px var(--font);padding:8px 0;min-height:70px;resize:vertical}
/* workout */
.wp{height:3px;background:var(--fill);flex:none}.wp div{height:100%;background:var(--good);transition:width .3s}
.ex{margin-bottom:22px}
.ex-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px 6px}
.ex-h h3{margin:0;font:600 20px var(--font-d);color:var(--tint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ex-h button{background:none;border:0;padding:0;cursor:pointer;display:flex;gap:8px;align-items:center;min-width:0}
.ex-h .tg{font-size:13px;color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex-cue{font-size:13px;color:var(--label-2);padding:0 4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets{background:var(--card);border-radius:var(--r-card);overflow:hidden}
.sg{display:grid;grid-template-columns:34px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center;padding:6px 12px}
.ex-h h3.ptn{color:var(--pt)}
.sg.hd{font-size:11px;font-weight:600;color:var(--label-2);padding-top:10px;padding-bottom:2px}
.sg .no{font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.sg .pv{font-size:15px;color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg input{width:100%;min-width:0;height:40px;border:0;border-radius:var(--r-ctl);background:var(--fill);text-align:center;font:600 17px var(--font);color:var(--label);font-variant-numeric:tabular-nums}
.sg.done{background:color-mix(in srgb,var(--good) 14%,transparent)}
.sg.done input{background:transparent}
.ck{width:44px;height:40px;border-radius:var(--r-ctl);border:0;background:var(--fill);cursor:pointer;display:grid;place-items:center;color:transparent}
.ck svg{width:18px;height:18px}
.sg.done .ck{background:var(--good);color:#fff}
.sg.done .ck svg{animation:pop .28s cubic-bezier(.2,.8,.2,1.2)}
@keyframes pop{0%{transform:scale(.5);opacity:.4}100%{transform:none;opacity:1}}
.sg{transition:background-color .2s}
.addset{width:100%;border:0;background:none;color:var(--tint);font-size:15px;font-weight:600;min-height:44px;border-top:.5px solid var(--sep);cursor:pointer}
.simple{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;gap:12px}
.rest{position:sticky;top:0;z-index:3;margin:-8px 0 14px;background:color-mix(in srgb,var(--card-2) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:var(--r-card);box-shadow:0 8px 30px rgba(0,0,0,.35);padding:10px 12px;display:flex;align-items:center;gap:10px}
.rest .tm{font:700 28px var(--font-r);font-variant-numeric:tabular-nums;min-width:72px}
.rest .nx{flex:1;min-width:0;font-size:13px;color:var(--label-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest button{border:0;background:var(--fill);border-radius:var(--r-ctl);min-height:36px;padding:0 10px;font-weight:600;font-size:15px;cursor:pointer;color:var(--tint)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:rgba(30,30,32,.94);color:#fff;padding:11px 16px;border-radius:var(--r-card);font-size:15px;font-weight:500;z-index:50;max-width:calc(100% - 32px);text-align:center}
@media (max-width:380px){.sg{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;padding:6px 8px}}

.day{display:flex;gap:14px;align-items:center;padding:11px 14px 11px 12px;position:relative;width:100%;text-align:left;background:none;border:0;cursor:pointer;color:inherit}
.day:active{background:var(--fill)}
.day + .day::before{content:"";position:absolute;top:0;left:70px;right:0;height:.5px;background:var(--sep)}
.dt{width:44px;flex:none;text-align:center;border-radius:var(--r-ctl);background:var(--fill);padding:5px 0 6px}
.dt .w{font-size:11px;font-weight:700;color:var(--label-2);}
.dt .n{font:600 22px/1.1 var(--font-r);font-variant-numeric:tabular-nums}
.dt.soon{background:color-mix(in srgb,var(--tint) 14%,transparent)}.dt.soon .w{color:var(--tint)}
.acts{flex:1;min-width:0;display:grid;gap:5px}
.act{display:flex;align-items:center;gap:8px;font-size:17px;min-width:0}
.act .dot{width:8px;height:8px;border-radius:50%;flex:none}
.act .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .sm{color:var(--label-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.off{color:var(--label-2)}
.ms-row .ms-when{font-weight:600;color:var(--label)}
/* health */
.num .k{font-size:11px;font-weight:600;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num .v{font:700 22px/1.15 var(--font-r);font-variant-numeric:tabular-nums;margin-top:2px}
.num .v small{font-size:13px;color:var(--label-2);font-weight:500}
.num .d{font-size:13px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:5px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}.meter div{height:100%;border-radius:3px}

<script>
(function(){

const RACE = "2027-05-02";
const S = {plan:{}, runs:[], loads:[], liftlog:{}, daily:{}, settings:{}, goals:null, goalSug:null, ptDaily:null, gear:null, milestones:null, requests:[], updates:[], program:null, import:null, fuel:null, loaded:false};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

const todayISO = () => iso(new Date());
const monday = s => { const d = parse(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); };
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], MONL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmtDate = s => { const d = parse(s); return DOW[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate(); };

const shortDate = s => { const d = parse(s); return MON[d.getMonth()]+" "+d.getDate(); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
function toSec(t){ if(t==null||t==="") return null; const p = String(t).trim().split(/\s*[:.\s]\s*/).map(Number); if(p.some(isNaN)) return null; return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p.length===2 ? p[0]*60+p[1] : p[0]*60; }
function fmtTime(sec){ if(!sec) return NA; sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h? h+":"+pad(m)+":"+pad(s) : m+":"+pad(s); }

const NA="No data";
/* Dumbbell loads are per hand; "30s" and "30" mean the same, so show and compute plain numbers. */

const sum = a => a.reduce((x,y)=>x+(+y||0),0);
const r1 = n => Math.round(n*10)/10;
const CHEV = '<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON = {

};
function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
/* Number boxes open the iPhone keyboard on its number side; letters are one tap away but a number-only box can't keep them, so say so. */
let badT=0; document.addEventListener("input", e=>{ const x=e.target; if(x&&x.type==="number"&&x.validity&&x.validity.badInput&&Date.now()-badT>2500){ badT=Date.now(); toast("Numbers only in this box"); } }, true);
/* Never redraw under a focused box (it closes the keyboard); redraw once he leaves it. */
let rqHeld=false;
const typing=()=>{ const a=document.activeElement; return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="checkbox"; };

function queue(){ if(typing()){ rqHeld=true; return; } if(rq) return; rq=true; requestAnimationFrame(()=>{rq=false; if(!W) render(); else if(dlg.open&&!wPeek) renderWorkout(); }); }

const settings = () => Object.assign({maxHR:188, easyCap:143, shoeName:"", shoeStart:"", shoeBase:0}, S.settings||{});
const runsOn = d => S.runs.filter(r=>r.date===d);
const weekRuns = m => S.runs.filter(r=>r.date>=m && r.date<=addDays(m,6));

function sessId(d, day){ const own=Object.entries(S.liftlog).find(([,l])=>l.date===d&&l.day===day); if(own) return own[0]; return S.liftlog[d] ? d+"~"+day : d; }

function dayStatus(d){
  const p = S.plan[d], ran = runsOn(d).length>0, lifted = liftDone(d);
  const wantRun = p && p.run && p.run.miles>0, wantLift = p && p.lift;

  if((wantRun?ran:true) && (wantLift?lifted:true)) return "done";

const LIFT_NAMES = {A:"Upper Strength", B:"Lower Strength", C:"Power", D:"Upper Hypertrophy", P:"PT Session"};

function weeklyBars(){
  const t = todayISO(), cur = monday(t), first = "2026-10-19";
  let last = addDays(cur, 21); const pd = Object.keys(S.plan).sort(); if(pd.length){ const lp=monday(pd[pd.length-1]); if(lp<last) last=lp; }
  const weeks=[]; for(let m=first; m<=last; m=addDays(m,7)) weeks.push(m);
  const data = weeks.map(m=>({m, plan:sum(weekDays(m).map(x=>x.p&&x.p.run?x.p.run.miles:0)), act:sum(weekRuns(m).map(r=>r.miles))}));
  const top = Math.max(10, Math.ceil(Math.max(...data.map(d=>Math.max(d.plan,d.act)))/5)*5);
  const W=640,H=230,L=6,R=58,T=12,B=40, cw=(W-L-R)/data.length, bw=Math.min(24,cw*.62);
  const y = v => T+(H-T-B)*(1-v/top);
  let g="";
  [0, top/2, top].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--sep)" ${v?'stroke-dasharray="2 3"':''}/><text x="${W-R+8}" y="${y(v)+7}">${v}</text>`; });
  data.forEach((d,i)=>{ const cx=L+cw*i+cw/2, x=cx-bw/2, isCur=d.m===cur, h=v=>Math.max(0,y(0)-y(v));
    if(d.plan>0) g+=`<rect x="${x}" y="${y(d.plan)}" width="${bw}" height="${h(d.plan)}" rx="5" fill="var(--fill-2)"/>`;
    if(d.act>0) g+=`<rect x="${x}" y="${y(d.act)}" width="${bw}" height="${h(d.act)}" rx="5" fill="var(--run)" opacity="${isCur?1:.85}"/>`;
    if(isCur) g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" style="fill:var(--label);font-weight:600">Now</text>`;
    else if(i%3===0) g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${shortDate(d.m)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly miles, planned and run">${g}</svg>`;
}
function lineChart(points, o){
  if(points.length<1) return `<div class="empty" style="padding:8px 0">${o.empty}</div>`;
  const W=640,H=210,L=6,R=84,T=14,B=38;
  const xs=points.map(p=>parse(p.x).getTime()); let x0=Math.min(...xs), x1=Math.max(...xs); if(x0===x1){x0-=3*864e5;x1+=3*864e5;}
  const ys=points.map(p=>p.y); let y0=Math.min(...ys), y1=Math.max(...ys); const py=(y1-y0)*.3||o.pad||5; y0-=py; y1+=py;
  const X=v=>L+(W-L-R)*((v-x0)/(x1-x0)), Y=v=> o.invert ? T+(H-T-B)*((v-y0)/(y1-y0)) : T+(H-T-B)*(1-(v-y0)/(y1-y0));
  let g=""; [y0+(y1-y0)*.15, (y0+y1)/2, y1-(y1-y0)*.15].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--sep)" stroke-dasharray="2 3"/><text x="${W-R+8}" y="${Y(v)+7}">${o.fmt(v)}</text>`; });
  const pts=points.map(p=>[X(parse(p.x).getTime()),Y(p.y)]), col=o.color||"var(--tint)", gid="g"+Math.random().toString(36).slice(2,7);
  if(pts.length>1){ const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    g+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".25"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B}Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`; }
  pts.forEach((p,i)=>{ if(pts.length>20&&i<pts.length-1) return; g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?col:'var(--card)'}" stroke="${col}" stroke-width="2"/>`; });
  g+=`<text x="${L}" y="${H-8}">${shortDate(points[0].x)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${shortDate(points[points.length-1].x)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}</svg>`;
}
function rolling(arr,key,n){ const pts=arr.filter(d=>d[key]!=null&&d[key]!=="").sort((a,b)=>a.date.localeCompare(b.date));
  return pts.map(d=>{ const w=pts.filter(x=>x.date<=d.date&&x.date>addDays(d.date,-n)); return {x:d.date,y:sum(w.map(v=>+v[key]))/w.length}; }); }

/* ---------- Today: rings, week strip, the day as a timeline, check-in ---------- */
let selDay = null; /* null means today */
const PT_SLOTS = {am:"Morning", day:"Through the day", pm:"Evening"};
/* Run warm-up: about 5 minutes of moving warm-ups, no long static holds before running. Time trial adds easy running and strides. */
const WARMUP = [["walk","Brisk walk","2 min"],["swingf","Leg swings, front to back","10 per leg"],["swings","Leg swings, side to side","10 per leg"],["lunge","Walking lunges","5 per leg"],["knees","High knees or skips","20 yd"],["calf","Calf raises","10"],["slow","Run the first half mile very easy","Then settle into easy pace"]];
const WARMUP_TT = [["jog","Easy running","10 to 15 min"],["drills","Leg swings, lunges, high knees","1 round"],["strides","Strides, quick but relaxed","4 × 20 s, walk back"]];
const warmList = p => /time trial/i.test((p&&p.run&&p.run.label)||"") ? WARMUP_TT : WARMUP;
function warmState(d){ const p=S.plan[d]||{}, list=warmList(p), got=(S.daily[d]&&S.daily[d].warm)||{}; const n=list.filter(([id])=>got[id]).length; return {list, got, n, all:n===list.length}; }
function ptSlot(d, slot){ const items=((S.ptDaily&&S.ptDaily.items)||[]).filter(x=>(x.slot||"pm")===slot), got=(S.daily[d]&&S.daily[d].pt)||{};
  const done=items.filter(x=>(got[x.id]||0)>=(x.target||1)).length; return {items, done, all:items.length>0&&done===items.length}; }
function ptWeek(m, t){ const items=(S.ptDaily&&S.ptDaily.items)||[]; let done=0; for(let i=0;i<7;i++){ const d=addDays(m,i); if(d>t) continue; const got=(S.daily[d]&&S.daily[d].pt)||{}; if(items.length&&items.every(x=>(got[x.id]||0)>=(+x.target||1))) done++; } return {n:7, done}; }
function ptToday(d){ const items=(S.ptDaily&&S.ptDaily.items)||[], got=(S.daily[d]&&S.daily[d].pt)||{}; return {n:items.length, done:items.filter(x=>(got[x.id]||0)>=(x.target||1)).length}; }
function easyPaceSec(){ const cap=settings().easyCap; const e=[...S.runs].filter(r=>r.avgHR&&r.avgHR<=cap+2&&pace(r)).sort((a,b)=>a.date.localeCompare(b.date)); return e.length?pace(e[e.length-1]):570; }
/* The day in the order he does it: morning PT, lift (Day C comes before the run), run, PT session, soccer, home PT through the day and evening. */
const RIEGEL=(t,d1,d2)=>t*Math.pow(d2/d1,1.06);
function refRace(){ const st=settings(); const t=st.ref5k?toSec(st.ref5k):null; return t?{sec:t, miles:3.107, label:`5K in ${fmtTime(t)}`}:null; }
function paces(){ const st=settings(), ref=refRace(), max=+st.maxHR||188, cap=+st.easyCap||143;
  if(!ref){ const e=easyPaceSec(); return {ok:false, easy:[e*0.98,e*1.08], long:[e,e*1.1], rec:[e*1.08,e*1.2], hr:{easy:[0,cap], long:[0,cap], rec:[0,cap-10]}, note:"Easy pace comes from your recent runs under the heart-rate cap. Add a 5K time (the Dec 16 time trial) to unlock marathon, threshold and interval paces."}; }
  const p5=ref.sec/ref.miles, pm=RIEGEL(ref.sec,ref.miles,26.219)/26.219, p15=RIEGEL(ref.sec,ref.miles,9.32)/9.32;
  return {ok:true, ref, vo2:[p5-5,p5+5], lt:[p15-5,p15+10], mp:[pm-5,pm+5], easy:[pm+60,pm+105], long:[pm+45,pm+105], rec:[pm+105,pm+150],
    hr:{vo2:[Math.round(max*.94),max], lt:[Math.round(max*.86),Math.round(max*.92)], mp:[Math.round(max*.80),Math.round(max*.88)], easy:[0,cap], long:[0,cap+5], rec:[0,cap-10]},
    note:`From ${ref.label}. Easy and long runs stay under heart rate ${cap} whatever the pace says.`}; }
const PACE_NAMES={rec:"Recovery", easy:"Easy", long:"Long run", mp:"Marathon pace", lt:"Threshold", vo2:"Intervals"};
function runKind(run){ const t=`${(run&&run.label)||""} ${(run&&run.detail)||""}`.toLowerCase(); if(/marathon.pace|\bmp\b|dress rehearsal/.test(t)) return "mp"; if(/time trial|5k race|tune-up|\brace\b(?!\s*pace)/.test(t)) return "race"; if(/threshold|\blt\b|tempo/.test(t)) return "lt"; if(/vo2|interval|\d+\s*[x×]\s*\d+\s*m\b/.test(t)) return "vo2"; if(/recovery/.test(t)) return "rec"; if((run&&run.long)||/long/.test(t)) return "long"; return "easy"; }
const fmtRange=r=>`${fmtPace(Math.round(r[0]))} to ${fmtPace(Math.round(r[1]))}`;
function hrText(z){ const h=paces().hr[z]; if(!h) return ""; return h[0]?`HR ${h[0]} to ${h[1]}`:`HR under ${h[1]}`; }
function runTarget(run){ const k=runKind(run); if(k==="race") return "All out, even pacing, no HR cap"; const P=paces(); const r=P[k]||P.easy; return `${fmtRange(r)} /mi · ${hrText(P[k]?k:"easy")}`; }
function pacesCard(){ const P=paces(); const zones=P.ok?["rec","easy","long","mp","lt","vo2"]:["rec","easy","long"];
  return `<div class="sec"><div class="sec-h"><h2>Your paces</h2><span class="ms-when">${P.ok?esc(P.ref.label):"Set a 5K time"}</span></div><button class="group" type="button" data-act="paces" style="display:block;width:100%;text-align:left;border:0;color:inherit;cursor:pointer;padding:0">${zones.map(z=>`<div class="row"><div class="main"><div class="t">${PACE_NAMES[z]}</div><div class="s">${esc(hrText(z))}</div></div><div class="v">${esc(fmtRange(P[z]))}</div></div>`).join("")}</button><div class="foot">${esc(P.note)}</div></div>`; }
function pacesSheet(){ const st=settings(), P=paces();
  openSheet(navBar(navBtn("close","Close"),"Training paces",navBtn("pacesave","Save",'style="font-weight:600"'))+`<div class="sh-body"><div class="group"><div class="frow"><label for="ref5k">Recent 5K time</label><input id="ref5k" type="text" inputmode="text" autocomplete="off" placeholder="24:30" value="${esc(st.ref5k||"")}" aria-label="5K time"></div><div class="frow"><label for="maxHR">Max heart rate</label><input id="maxHR" type="number" value="${esc(String(st.maxHR||188))}" aria-label="Max heart rate"></div><div class="frow"><label for="easyCap">Easy run HR cap</label><input id="easyCap" type="number" value="${esc(String(st.easyCap||143))}" aria-label="Easy heart rate cap"></div></div>
    <div class="foot">Paces are predicted from the 5K with the Riegel formula (Riegel PS, American Scientist, 1981) and Daniels' training zones; the coach fills the 5K in after the Dec 16 time trial, or type one here.</div>
    <div class="sec">${pacesCard().replace('data-act="paces"','').replace('cursor:pointer','cursor:default')}</div></div>`); }
async function savePaces(){ const ref5k=($("#ref5k")||{}).value||"", maxHR=+($("#maxHR")||{}).value||188, easyCap=+($("#easyCap")||{}).value||143;
  const r5=toSec(ref5k); if(ref5k&&(!r5||r5<12*60||r5>60*60)){ toast("Enter the 5K like 24:30"); return; }
  await save(db.doc("settings/main"), Object.assign({}, S.settings||{}, {ref5k, maxHR, easyCap}), "Paces saved"); }
function dayItems(d){
  const p=S.plan[d]||{}, out=[], st=settings();
  const home=slot=>{ const x=ptSlot(d,slot); if(!x.items.length) return; out.push({k:"home", slot, when:PT_SLOTS[slot], title:"PT at home", sub:x.all?`${x.done} of ${x.items.length} done`:x.done?`${x.items.length-x.done} left`:x.items.map(i=>i.name).join(", "), done:x.all}); };
  home("am");
  if(p.lift){ const l=sessOn(d,p.lift)||logsOn(d).find(x=>x.day!=="P")||null, n=exFor(p.lift).filter(e=>e.block!=="Prep"&&e.block!=="Finish").length;
    out.push({k:"lift", day:p.lift, when:"Lift", title:`Day ${p.lift} · ${LIFT_NAMES[p.lift]||""}`, sub:`${n} exercises${p.liftNote?" · "+p.liftNote:""}`, done:!!l&&l.status!=="in_progress", open:!!l&&l.status==="in_progress"}); }
  const tot=rr=>({miles:sum(rr.map(r=>r.miles)), timeSec:sum(rr.map(r=>r.timeSec))});

  return {level, run, k, mi, lift:!!p.lift, soccer:!!p.soccer, label:parts.join(" + ")||"Rest day", longMin:run?Math.round(mi*((paces()[k]||paces().easy)[1])/60):0}; }

async function toJpeg(file){
  try{ const bmp = await createImageBitmap(file); const max=2400, sc=Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",.85)); }catch(_){ return null; }
}
async function addFiles(list){
  const t=$("#reqText"); if(t) reqDraft.text=t.value;
  for(const f of list){
    const isPdf = f.type==="application/pdf" || /\.pdf$/i.test(f.name);
    const entry={name:f.name||"file", type:isPdf?"application/pdf":"image/jpeg", uploading:true}; reqDraft.files.push(entry); const box=$("#attList"); if(box) box.innerHTML=attHtml();
    try{
      const blob = isPdf ? f : await toJpeg(f);
      if(!blob) throw {code:"unsupported_type"};
      const r = await assets.upload(blob, {type: isPdf?"application/pdf":"image/jpeg"});
      entry.id=r.id; entry.uploading=false;
    }catch(err){ reqDraft.files.splice(reqDraft.files.indexOf(entry),1); toast(err&&err.code==="too_large"?"That file is over 20 MB":"Couldn't attach that file"); }
    const b2=$("#attList"); if(b2) b2.innerHTML=attHtml();
  }
}

/* A set is a best when its estimated max beats every earlier logged set of the same exercise (needs at least one earlier set, reps 12 or fewer). */
function bestBefore(id, date){ const base=String(id).split("~")[0]; let best=0;
  Object.values(S.liftlog).forEach(l=>{ if(!l.exercises||l.date>=date) return; l.exercises.forEach(x=>{ if(x.id!==id) return; x.sets.forEach(st=>{ if(st.done){ const v=e1rm(parseFloat(st.load),parseInt(st.reps)); if(v>best) best=v; } }); }); });
  const ld=id===base?S.loads.find(x=>x.id===base):null; (ld&&ld.history||[]).forEach(h=>{ if(h.date<date){ const v=e1rm(parseFloat(h.load),parseInt(h.reps)); if(v>best) best=v; } });
  return best; }
function isPR(ex, st){ const v=e1rm(parseFloat(st.load),parseInt(st.reps)); if(!v) return false; const b=bestBefore(ex.id, W.date);
  const today=Math.max(0,...ex.sets.filter(x=>x!==st&&x.done).map(x=>e1rm(parseFloat(x.load),parseInt(x.reps))||0));
  return b>0 && v>b+0.5 && v>today; }

    <div class="sec"><div class="cap">Recent</div><div class="group">${pts.slice(-8).reverse().map(q=>`<div class="row"><div class="main"><div class="t">${esc(fmtDate(q.x))}</div></div><div class="v">${f(q.y)}</div></div>`).join("")||'<div class="empty">No readings yet.</div>'}</div></div></div>`); }

  try{ localStorage.setItem(DRAFT, JSON.stringify({key, at:Date.now(), v})); }catch(_){} }

    pttick:()=>ptTick(a.dataset.id), ptall:ptAll, soccertick:async()=>{ const d=a.dataset.d, cur=Object.assign({}, S.daily[d]||{}); const on=!cur.soccer; const p=db.collection("daily").doc(d).set(Object.assign(cur,{date:d, soccer:on})); toast(on?"Soccer logged":"Soccer unmarked"); try{ await p; }catch(err){ failed(err); } },
    runquick:()=>quickRun(a.dataset.d), rundone:()=>quickRun(a.dataset.d), rundel:()=>runDel(a.dataset.id),    paces:pacesSheet, pacesave:savePaces, thread:coachThread, threadsend:async()=>{ const t=$("#reqText"); if(t) reqDraft.text=t.value; await saveReq(); coachThread(); }, ready:readySheet, push:pushToggle, watchsync:watchSheet, copyurl:()=>{ const t=($("#haeUrl")||{}).textContent||""; if(!/^https:/.test(t)){ toast("No URL yet"); return; } (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Copied"),()=>toast("Couldn't copy")); }, pweek:()=>pweekSheet(a.dataset.w), newreq:()=>reqForm(a.dataset.pre), reqtpl:()=>{ const t=$("#reqText"); if(!t) return; const cur=t.value.trim(); t.value=cur?cur+"\n"+a.dataset.t:a.dataset.t; reqDraft.text=t.value; t.focus(); t.setSelectionRange(t.value.length,t.value.length); }, attach:()=>$("#fileIn").click(), attdel:()=>{ const t=$("#reqText"); if(t) reqDraft.text=t.value; reqDraft.files.splice(+a.dataset.i,1); $("#attList").innerHTML=attHtml(); },

/* ---------- data ---------- */
(async function boot(){
  render();
  const c=window.claude; db = c&&c.use ? await c.use("db") : null; if(c&&c.use) c.use("assets").then(a=>{ assets=a; }).catch(()=>{});
  if(!db){ $("#view").innerHTML='<h1 class="large">Today</h1><div class="group"><div class="empty">Your plan can\'t be reached in this view. Open it from your artifacts while signed in to Claude.</div></div>'; return; }
  const timer=setTimeout(()=>{ if(!S.loaded) toast("Still loading. Data may be out of date."); },10000);
  let reopened=false;
  const mark=s=>{ if(!s.metadata.fromCache){ S.loaded=true; clearTimeout(timer); } queue();
    if(!reopened&&S.loaded&&S.loads.length){ reopened=true; let d=null; try{ d=localStorage.getItem("fp-w-open"); }catch(_){} const loc=wLocal(); if(d&&loc&&loc.date===todayISO()&&loc.status==="in_progress"&&!W) setTimeout(()=>startWorkout(d),50); } };
  const err=()=>{ S.loaded=true; clearTimeout(timer); queue(); };
  const byDate=(s,k)=>{ S[k]={}; s.docs.forEach(d=>{ const v=d.data(); S[k][v.date||d.id]=v; }); };
  db.collection("plan").onSnapshot(s=>{ byDate(s,"plan"); mark(s); },err);
  db.collection("runs").onSnapshot(s=>{ S.runs=s.docs.map(d=>Object.assign({id:d.id},d.data())); mark(s); },err);
  db.collection("loads").onSnapshot(s=>{ S.loads=s.docs.map(d=>{ const v=Object.assign({id:d.id},d.data()); v.load=noS(v.load); if(Array.isArray(v.history)) v.history=v.history.map(h=>Object.assign({},h,{load:noS(h.load)})); return v; }); mark(s); },err);
  db.collection("liftlog").onSnapshot(s=>{ S.liftlog={}; s.docs.forEach(d=>{ const v=d.data(); (v.exercises||[]).forEach(e=>(e.sets||[]).forEach(x=>{ x.load=noS(x.load); })); (v.done||[]).forEach(x=>{ x.load=noS(x.load); }); S.liftlog[d.id]=Object.assign({date:d.id.split("~")[0]}, v); }); mark(s); },err);
  db.collection("daily").onSnapshot(s=>{ byDate(s,"daily"); mark(s); },err);
  db.doc("settings/main").onSnapshot(d=>{ S.settings=d.exists?d.data():{}; queue(); },()=>{});
  db.doc("settings/gear").onSnapshot(d=>{ S.gear=d.exists?d.data():null; queue(); },()=>{});
  db.doc("settings/milestones").onSnapshot(d=>{ S.milestones=d.exists?d.data():null; queue(); },()=>{});
  db.collection("requests").onSnapshot(s=>{ S.requests=s.docs.map(d=>Object.assign({id:d.id},d.data())); queue(); },()=>{});
  db.collection("updates").onSnapshot(s=>{ S.updates=s.docs.map(d=>Object.assign({id:d.id},d.data())); queue(); },()=>{});
  db.doc("settings/goals").onSnapshot(d=>{ S.goals=d.exists?d.data():null; queue(); },()=>{});
  db.doc("settings/program").onSnapshot(d=>{ S.program=d.exists?d.data():null; queue(); },()=>{});
  db.doc("settings/import").onSnapshot(d=>{ S.import=d.exists?d.data():null; queue(); },()=>{});
  db.doc("settings/fuel").onSnapshot(d=>{ S.fuel=d.exists?d.data():null; queue(); },()=>{});
  refreshPush();
  db.doc("settings/goalSuggestions").onSnapshot(d=>{ S.goalSug=d.exists?d.data():null; queue(); },()=>{});
})();
})();
