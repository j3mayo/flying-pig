<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Healthspan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Healthspan</title>
<style>
/* Layout: iOS-native grouped lists. Sticky translucent nav bar, large title, inset-grouped sections, translucent tab bar. Sheets for forms, full-screen sheet for workouts. */
:root{
  --bg:#000000; --card:#161618; --card-2:#232326; --fill:rgba(120,120,128,.22); --fill-2:rgba(120,120,128,.34);
  --sep:rgba(84,84,88,.55); --label:#FFFFFF; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.32);
  --tint:#0A84FF; --run:#30D158; --lift:#0A84FF; --pt:#BF5AF2; --soc:#FF9F0A; --warn:#FF9F0A; --bad:#FF453A; --good:#30D158;
  --bar:rgba(10,10,12,.88); --on-tint:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--label);font:17px/1.35 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font:inherit;color:inherit}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--sep)}
.nav-in{max-width:680px;margin:0 auto;height:44px;display:flex;align-items:center;justify-content:space-between;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-title{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s}
.nav.scrolled .nav-title{opacity:1}
.nav-btn{background:none;border:0;color:var(--tint);font-size:17px;padding:8px 0;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:4px}
.nav-btn svg{width:22px;height:22px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
.large{font:700 34px/1.12 var(--font-d);letter-spacing:.01em;margin:2px 0 2px}
.sub{color:var(--label-2);font-size:15px;margin-bottom:18px}
.sec{margin-top:22px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 7px;gap:10px}
.sec-h h2{font:600 20px var(--font-d);margin:0;letter-spacing:.01em}
.sec-h .lnk{color:var(--tint);font-size:15px;background:none;border:0;cursor:pointer;padding:0 4px;min-height:44px;margin:-13px -4px;display:inline-flex;align-items:center}
.cap{color:var(--label-2);font-size:13px;text-transform:uppercase;letter-spacing:.02em;padding:0 16px 7px}
.foot{color:var(--label-2);font-size:13px;padding:7px 16px 0}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;position:relative;width:100%;text-align:left;background:none;border:0}
.row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row.ind + .row::before,.group .row.ind-next::before{left:56px}
button.row{cursor:pointer}
button.row:active{background:var(--fill)}
.row .main{flex:1;min-width:0}
.row .t{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{flex:none;max-width:52%;overflow:hidden;text-overflow:ellipsis}
.wrapok .t,.wrapok .s{white-space:normal}
.info{width:24px;height:24px;border-radius:50%;border:0;background:var(--fill);color:var(--tint);font:700 14px/1 Georgia,"Times New Roman",serif;font-style:italic;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0}
.hero{padding:4px 4px 14px}
.hero .big{font:700 28px/1.15 var(--font-d);font-variant-numeric:tabular-nums}
.hero .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.steps{margin:0;padding:12px 16px 12px 36px;display:grid;gap:8px;font-size:16px;line-height:1.4}
.para{padding:12px 16px;font-size:16px;line-height:1.45;margin:0}
.ta{width:100%;min-height:150px;border:0;background:var(--card);border-radius:12px;padding:14px 16px;font:17px/1.4 var(--font);color:var(--label);resize:vertical}
.row .s{font-size:15px;color:var(--label-2);margin-top:1px}
.row .v{color:var(--label-2);font-size:17px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{width:8px;height:14px;flex:none;color:var(--label-3)}
.ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:18px;height:18px}
.ico.run{background:var(--run)} .ico.lift{background:var(--lift)} .ico.soc{background:var(--soc)} .ico.rest{background:#636366} .ico.extra{background:var(--pt)} .ico.note{background:#5E5CE6}
.btn-big{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:50px;border-radius:12px;border:0;background:var(--tint);color:var(--on-tint);font-weight:600;font-size:17px;cursor:pointer}
.btn-big.sec2{background:var(--fill);color:var(--tint)}
.btn-big:active{opacity:.8}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--label-2);white-space:nowrap}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.pill.tint{color:var(--tint);background:color-mix(in srgb,var(--tint) 16%,transparent)}
.rings{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:16px}
.rings svg{width:112px;height:112px}
.ring-stats{display:grid;gap:10px}
.ring-stat .k{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.ring-stat .n{font:600 24px/1.1 var(--font-d);font-variant-numeric:tabular-nums}
.ring-stat .n small{font-size:15px;color:var(--label-2);font-weight:500}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px 10px 14px;text-align:center}
.wk .d{font-size:12px;color:var(--label-2);font-weight:600}
.wk .c{width:34px;height:34px;margin:6px auto 4px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;border:2px solid var(--fill-2);color:var(--label-2)}
.wk .c.done{background:var(--good);border-color:var(--good);color:#fff}
.wk .c.part{border-color:var(--warn);color:var(--warn)}
.wk .c.miss{border-color:var(--bad);color:var(--bad)}
.wk .c.rest{border-style:dashed}
.wk .c.today{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--tint)}
.wk .l{font-size:11px;color:var(--label-2);min-height:14px}
.callout{background:var(--card);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.callout .h svg{width:16px;height:16px;color:var(--run)}
.callout .h{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.02em}
.callout p{margin:0;font-size:16px;line-height:1.4}
.feel{display:grid;gap:14px;padding:14px 16px}
.feel .q{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between}
.feel .q span{color:var(--label-2);font-weight:500}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale.s11{grid-template-columns:repeat(6,1fr)}
.scale button{min-height:40px;border-radius:10px;border:0;background:var(--fill);font-size:15px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;min-height:32px;font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
.sh:focus{outline:none}
button:focus:not(:focus-visible),input:focus:not(:focus-visible){outline:none}
.att{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.att .a{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--label-2);text-align:center;padding:6px}
.att img{width:100%;height:100%;object-fit:cover;max-width:100%}
.att .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;cursor:pointer}
.frow input[type=date]{min-height:34px}
.chart{background:var(--card);border-radius:12px;padding:14px 16px 10px}
.chart .k{font-size:13px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.02em}
.chart .n{font:700 28px/1.15 var(--font-d);font-variant-numeric:tabular-nums;margin-top:2px}
.chart .n small{font-size:15px;color:var(--label-2);font-weight:500}
.chart .d{font-size:13px;color:var(--label-2);margin-bottom:6px}
.chart .take{font-size:15px;margin-top:6px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--label-2);font:21px var(--font)}
.empty{color:var(--label-2);font-size:15px;padding:14px 16px}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:12px;padding:12px 14px;min-width:0}
.tile .k{font-size:12px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.02em}
.tile .n{font:700 24px/1.15 var(--font-d);margin-top:4px;font-variant-numeric:tabular-nums}
.tile .n small{font-size:13px;color:var(--label-2);font-weight:500}
.tile .s{font-size:13px;color:var(--label-2)}
.up{color:var(--good)} .down{color:var(--bad)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;color:#8E8E93;font-size:10px;font-weight:500;padding:2px 0 4px;cursor:pointer;display:grid;justify-items:center;gap:2px;min-height:48px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--tint)}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
/* sheets */
dialog{border:0;padding:0;background:var(--bg);color:var(--label);max-width:none;max-height:none}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog.sheet{margin:auto auto 0;width:100%;max-width:560px;border-radius:14px 14px 0 0;max-height:92dvh}
dialog.full{margin:0;width:100%;height:100%;border-radius:0}
.sh{display:flex;flex-direction:column;max-height:92dvh}
dialog.full .sh{height:100%;max-height:none}
.sh-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);flex:none}
dialog.sheet .sh-nav{padding-top:0;border-radius:14px 14px 0 0}
.sh-nav .ttl{font-weight:600;text-align:center}
.sh-nav .ttl small{display:block;font-weight:400;font-size:13px;color:var(--label-2);font-variant-numeric:tabular-nums}
.sh-nav .l{justify-self:start}.sh-nav .r{justify-self:end;font-weight:600}
.sh-body{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));flex:1;-webkit-overflow-scrolling:touch}
.frow{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 16px;position:relative}
.frow + .frow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.frow label{flex:1;font-size:17px}
.frow input,.frow select{flex:0 0 46%;text-align:right;border:0;background:none;color:var(--tint);font:17px var(--font);padding:8px 0;min-width:0}
.frow textarea{width:100%;border:0;background:none;color:var(--label);font:17px var(--font);padding:8px 0;min-height:70px;resize:vertical}
.wp{height:3px;background:var(--fill);flex:none}.wp div{height:100%;background:var(--good);transition:width .3s}
.ex{margin-bottom:20px}
.ex-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 4px 6px}
.ex-h h3{margin:0;font:600 19px var(--font-d);color:var(--tint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ex-h button{background:none;border:0;padding:0;cursor:pointer;display:flex;gap:8px;align-items:center;min-width:0}
.ex-h .tg{font-size:13px;color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex-cue{font-size:13px;color:var(--label-2);padding:0 4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets{background:var(--card);border-radius:12px;overflow:hidden}
.sg{display:grid;grid-template-columns:34px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center;padding:6px 12px}
.sg.hd{font-size:12px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.02em;padding-top:10px;padding-bottom:2px}
.sg .no{font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.sg .pv{font-size:14px;color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg input{width:100%;min-width:0;height:36px;border:0;border-radius:8px;background:var(--fill);text-align:center;font:600 17px var(--font);color:var(--label);font-variant-numeric:tabular-nums}
.sg.done{background:color-mix(in srgb,var(--good) 14%,transparent)}
.sg.done input{background:transparent}
.ck{width:44px;height:36px;border-radius:8px;border:0;background:var(--fill);cursor:pointer;display:grid;place-items:center;color:transparent}
.ck svg{width:18px;height:18px}
.sg.done .ck{background:var(--good);color:#fff}
.addset{width:100%;border:0;background:none;color:var(--tint);font-size:15px;font-weight:600;min-height:40px;border-top:.5px solid var(--sep);cursor:pointer}
.simple{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;gap:12px}
.rest{position:sticky;bottom:0;margin:12px -4px 0;background:var(--card);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:10px 12px;display:flex;align-items:center;gap:10px}
.rest .tm{font:700 28px var(--font-d);font-variant-numeric:tabular-nums;min-width:72px}
.rest .nx{flex:1;min-width:0;font-size:13px;color:var(--label-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest button{border:0;background:var(--fill);border-radius:8px;min-height:36px;padding:0 10px;font-weight:600;font-size:15px;cursor:pointer;color:var(--tint)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:rgba(30,30,32,.94);color:#fff;padding:11px 16px;border-radius:12px;font-size:15px;font-weight:500;z-index:50;max-width:calc(100% - 32px);text-align:center}
@media (max-width:380px){.rings{grid-template-columns:1fr;justify-items:center}.stat3{grid-template-columns:1fr 1fr}.sg{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;padding:6px 8px}}

.day{display:flex;gap:14px;align-items:center;padding:11px 14px 11px 12px;position:relative;width:100%;text-align:left;background:none;border:0;cursor:pointer;color:inherit}
.day:active{background:var(--fill)}
.day + .day::before{content:"";position:absolute;top:0;left:70px;right:0;height:.5px;background:var(--sep)}
.dt{width:44px;flex:none;text-align:center;border-radius:10px;background:var(--fill);padding:5px 0 6px}
.dt .w{font-size:11px;font-weight:700;color:var(--label-2);letter-spacing:.06em}
.dt .n{font:600 21px/1.1 var(--font-d);font-variant-numeric:tabular-nums}
.dt.soon{background:color-mix(in srgb,var(--tint) 14%,transparent)}.dt.soon .w{color:var(--tint)}
.acts{flex:1;min-width:0;display:grid;gap:5px}
.act{display:flex;align-items:center;gap:8px;font-size:16px;min-width:0}
.act .dot{width:8px;height:8px;border-radius:50%;flex:none}
.act .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .sm{color:var(--label-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.rest{color:var(--label-2)}
.pillar{background:var(--card);border-radius:14px;padding:14px 16px 12px;margin-top:14px}
.pillar .ph{display:flex;align-items:center;gap:10px}
.pillar h3{margin:0;font:600 18px var(--font-d);flex:1;min-width:0}
.pillar .nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin-top:14px}
.num .k{font-size:12px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num .v{font:700 24px/1.15 var(--font-d);font-variant-numeric:tabular-nums;margin-top:2px}
.num .v small{font-size:13px;color:var(--label-2);font-weight:500}
.num .d{font-size:13px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillar svg{display:block;width:100%;height:auto;margin-top:12px}
.pillar .ph .ico svg{width:18px;height:18px;margin:0}
.pillar .why{font-size:13px;color:var(--label-2);margin-top:10px;line-height:1.4;border-top:.5px solid var(--sep);padding-top:10px}
.meter{height:5px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}.meter div{height:100%;border-radius:3px}
.wtool{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px 14px}
.wtool button{border:0;background:var(--fill);color:var(--tint);border-radius:999px;min-height:44px;padding:0 16px;font-weight:600;font-size:15px;cursor:pointer}
.ex.ss{border-left:3px solid var(--tint);padding-left:10px}
.ex.ss-mid{margin-bottom:10px}
.ss-cap{color:var(--tint);padding:2px 4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtool .wh{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtool button,.sugbtns button,.ex-h .swap,.rest button,.btn-big,.pill,.seg button,.scale button,.del,.lnk,.nav-btn{white-space:nowrap}
.btn-big{overflow:hidden;text-overflow:ellipsis}
.wtool button.on{background:var(--tint);color:var(--on-tint)}
.paused{display:flex;align-items:center;justify-content:space-between;gap:12px;background:color-mix(in srgb,var(--warn) 14%,var(--card));border-radius:12px;padding:12px 14px;margin-bottom:18px}
.ex-h .swap{border:0;background:var(--fill);color:var(--tint);border-radius:999px;font-size:15px;font-weight:600;min-height:36px;padding:0 14px;cursor:pointer;flex:none}
.sg .no{border:0;background:none;font:600 16px var(--font);color:var(--label);padding:0;min-height:36px;cursor:pointer}

<script>window.FP_ICON='apple-touch-icon.png';
/* Platform layer: Supabase-backed db/assets with the same API the UI uses, sign-in gate, attachment text extraction. */
window.FP = (function(){
const SB_URL = "https://jpfvrrdxulcawectrozo.supabase.co";
const SB_KEY = "sb_publishable_fcvSMeCg8C95dkbSqm7Xrg_3YyC9dzK";
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"fp-auth"}}) : null;
const clone = v => v===undefined ? undefined : JSON.parse(JSON.stringify(v));
const ls = { get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(_){} } };

function makeDb(uid){
  const cache = new Map(), subs = [];
  let fromCache = true, started = false;
  try{ const c = JSON.parse(ls.get("fp-cache")||"null"); if(c && c.uid===uid) c.rows.forEach(([k,v])=>cache.set(k,v)); }catch(_){}
  const key = (c,i)=>c+"/"+i;
  function snapColl(coll){ const docs=[]; for(const [k,v] of cache){ const j=k.indexOf("/"); if(k.slice(0,j)===coll) docs.push({id:k.slice(j+1), data:()=>clone(v)}); } return {docs, metadata:{fromCache}}; }
  function snapDoc(coll,id){ const v=cache.get(key(coll,id)); return {id, exists:v!==undefined, data:()=>clone(v), metadata:{fromCache}}; }
  function fire(s){ try{ s.cb(s.id ? snapDoc(s.coll,s.id) : snapColl(s.coll)); }catch(e){ console.error(e); } }
  function emit(coll){ subs.forEach(s=>{ if(s.coll===coll) fire(s); }); }
  let pt; function persist(){ clearTimeout(pt); pt=setTimeout(()=>ls.set("fp-cache", JSON.stringify({uid, rows:[...cache]})), 400); }
  async function load(){
    let all=[], from=0;
    for(;;){ const {data,error} = await sb.from("docs").select("coll,id,data").range(from, from+999); if(error) throw error; all=all.concat(data); if(data.length<1000) break; from+=1000; }
    cache.clear(); all.forEach(r=>cache.set(key(r.coll,r.id), r.data)); fromCache=false; persist();
    subs.forEach(fire);
  }
  function listen(){
    sb.channel("docs-live").on("postgres_changes", {event:"*", schema:"public", table:"docs"}, p=>{
      if(p.eventType==="DELETE"){ const o=p.old||{}; if(o.coll){ cache.delete(key(o.coll,o.id)); emit(o.coll); } }
      else { const n=p.new; cache.set(key(n.coll,n.id), n.data); emit(n.coll); }
      persist();
    }).subscribe();
  }
  async function start(){
    if(started) return; started=true;
    try{ await load(); }catch(e){ subs.forEach(s=>s.err&&s.err(e)); }
    listen();
    document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") load().catch(()=>{}); });
  }
  async function write(coll, id, data){
    const k=key(coll,id), prev=cache.get(k);
    cache.set(k, clone(data)); emit(coll); persist();
    const {error} = await sb.from("docs").upsert({coll, id, data}, {onConflict:"coll,id"});
    if(error){ if(prev===undefined) cache.delete(k); else cache.set(k, prev); emit(coll); persist(); throw error; }
  }
  function ref(coll, id){ return {
    id,
    set: d => write(coll, id, d),
    update: d => write(coll, id, Object.assign({}, cache.get(key(coll,id))||{}, d)),
    get: async () => snapDoc(coll, id),
    delete: async () => { const k=key(coll,id), prev=cache.get(k); cache.delete(k); emit(coll); persist();
      const {error} = await sb.from("docs").delete().match({coll, id}); if(error){ if(prev!==undefined){ cache.set(k,prev); emit(coll); persist(); } throw error; } },
    onSnapshot(cb, err){ const s={coll, id, cb, err}; subs.push(s); if(cache.size) fire(s); return ()=>subs.splice(subs.indexOf(s),1); }
  }; }
  return {
    collection: coll => ({ doc: id => ref(coll, id), onSnapshot(cb, err){ const s={coll, cb, err}; subs.push(s); if(cache.size) fire(s); return ()=>subs.splice(subs.indexOf(s),1); } }),
    doc: path => { const [c,i] = path.split("/"); return ref(c, i); },
    start
  };
}

function makeAssets(uid){ return {
  async upload(blob, opt){
    if(blob.size > 20*1024*1024) throw {code:"too_large"};
    const type = (opt&&opt.type) || blob.type, ext = type==="application/pdf" ? "pdf" : "jpg";
    const path = uid+"/"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
    const {error} = await sb.storage.from("attachments").upload(path, blob, {contentType:type, upsert:false});
    if(error) throw error;
    return {id:path};
  }
}; }

/* Signed URLs for private attachments. Returns a placeholder until ready, then asks the UI to redraw. */
const urls = {}, pending = {}; let onUrl = null;
const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
function blobSrc(id){
  if(!id) return BLANK;
  if(urls[id]) return urls[id];
  if(!pending[id] && sb){ pending[id]=true; sb.storage.from("attachments").createSignedUrl(id, 60*60*24).then(({data})=>{ if(data&&data.signedUrl){ urls[id]=data.signedUrl; onUrl&&onUrl(); } }).finally(()=>{ pending[id]=false; }); }
  return BLANK;
}

/* Text extraction so the nightly review can read PT plans. Runs on the phone. */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function ocr(img){
  if(!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  /* Clean up phone photos first: grayscale, stronger contrast, about 2000 px wide. Much better results on handouts. */
  try{ const bmp = img instanceof HTMLCanvasElement ? img : await createImageBitmap(img); const sc=Math.min(2.5, 2000/Math.max(bmp.width,1));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc); const x=c.getContext("2d");
    x.filter="grayscale(1) contrast(1.8) brightness(1.08)"; x.drawImage(bmp,0,0,c.width,c.height); img=c; }catch(_){}
  const r = await window.Tesseract.recognize(img, "eng");
  return (r && r.data && r.data.text || "").trim();
}
async function pdfText(file){
  if(!window.pdfjsLib){ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
  const doc = await window.pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  let out = [];
  for(let p=1; p<=Math.min(doc.numPages, 20); p++){ const pg=await doc.getPage(p); const tc=await pg.getTextContent(); out.push(tc.items.map(i=>i.str).join(" ")); }
  let text = out.join("\n").trim();
  if(text.length < 40){ /* scanned PDF: OCR the first pages */
    out = [];
    for(let p=1; p<=Math.min(doc.numPages, 4); p++){ const pg=await doc.getPage(p); const vp=pg.getViewport({scale:2}); const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height; await pg.render({canvasContext:c.getContext("2d"), viewport:vp}).promise; out.push(await ocr(c)); }
    text = out.join("\n").trim();
  }
  return text;
}
async function extractText(blob, isPdf){ try{ const t = isPdf ? await pdfText(blob) : await ocr(blob); return t.slice(0, 20000); }catch(e){ console.warn(e); return ""; } }

/* Sign-in gate */
async function session(){ if(!sb) return null; const {data} = await sb.auth.getSession(); return data && data.session; }
function showAuth(done){
  const el = document.createElement("div"); el.className="auth";
  el.innerHTML = `<div class="auth-in"><img class="auth-ic" src="${window.FP_ICON||""}" alt=""><h1 class="large" style="padding:0;text-align:center">Healthspan</h1>
    <div class="sub" style="text-align:center;padding:0 0 18px">Sign in to your training plan</div>
    <div class="group"><label class="row"><input id="auE" type="email" autocomplete="username" inputmode="email" placeholder="Email" autocapitalize="off"></label><label class="row"><input id="auP" type="password" autocomplete="current-password" placeholder="Password"></label></div>
    <div class="auth-msg" id="auM" role="status"></div>
    <button class="btn-big" type="button" id="auIn">Sign In</button>
    <button class="lnk auth-alt" type="button" id="auUp">First time here? Create your account</button></div>`;
  document.body.appendChild(el);
  const msg = t => { el.querySelector("#auM").textContent = t; };
  const vals = () => [el.querySelector("#auE").value.trim(), el.querySelector("#auP").value];
  let mode = "in";
  el.querySelector("#auUp").onclick = () => { mode = mode==="in" ? "up" : "in"; el.querySelector("#auIn").textContent = mode==="in" ? "Sign In" : "Create Account"; el.querySelector("#auUp").textContent = mode==="in" ? "First time here? Create your account" : "Have an account? Sign in"; el.querySelector("#auP").autocomplete = mode==="in" ? "current-password" : "new-password"; msg(""); };
  el.querySelector("#auIn").onclick = async () => {
    const [email, password] = vals();
    if(!email || !password){ msg("Enter your email and password"); return; }
    if(mode==="up" && password.length < 8){ msg("Use at least 8 characters"); return; }
    msg(mode==="in" ? "Signing in…" : "Creating your account…");
    if(mode==="up"){ const {error} = await sb.auth.signUp({email, password}); if(error){ msg(/closed|Database error/i.test(error.message) ? "This app already has its owner. Sign in instead." : error.message); return; } }
    const {error} = await sb.auth.signInWithPassword({email, password});
    if(error){ msg(/Invalid login/i.test(error.message) ? "Email or password is incorrect" : error.message); return; }
    el.remove(); done();
  };
  el.querySelector("#auP").addEventListener("keydown", e=>{ if(e.key==="Enter") el.querySelector("#auIn").click(); });
}
async function signOut(){ await sb.auth.signOut(); try{ localStorage.removeItem("fp-cache"); }catch(_){} location.reload(); }

return { ready: !!sb, makeDb, makeAssets, blobSrc, extractText, session, showAuth, signOut, set onUrl(f){ onUrl=f; } };
})();
</script>

const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };

const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function dayStatus(d){

  const wantRun = p && p.run && p.run.miles>0, wantLift = p && p.lift;
  if(!p || (!wantRun && !wantLift)) return (ran||lifted) ? "done" : "rest";

}
function weeklyBars(){
  const t = todayISO(), cur = monday(t), first = "2026-10-19";
  let last = addDays(cur, 21); const pd = Object.keys(S.plan).sort(); if(pd.length){ const lp=monday(pd[pd.length-1]); if(lp<last) last=lp; }
  const weeks=[]; for(let m=first; m<=last; m=addDays(m,7)) weeks.push(m);
  const data = weeks.map(m=>({m, plan:sum(weekDays(m).map(x=>x.p&&x.p.run?x.p.run.miles:0)), act:sum(weekRuns(m).map(r=>r.miles))}));
  const top = Math.max(10, Math.ceil(Math.max(...data.map(d=>Math.max(d.plan,d.act)))/5)*5);
  const W=640,H=230,L=6,R=58,T=12,B=40, cw=(W-L-R)/data.length, bw=Math.min(24,cw*.62);
  const y = v => T+(H-T-B)*(1-v/top);

  [0, top/2, top].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--sep)" ${v?'stroke-dasharray="2 3"':''}/><text x="${W-R+8}" y="${y(v)+7}">${v}</text>`; });
  data.forEach((d,i)=>{ const cx=L+cw*i+cw/2, x=cx-bw/2, isCur=d.m===cur, h=v=>Math.max(0,y(0)-y(v));
    if(d.plan>0) g+=`<rect x="${x}" y="${y(d.plan)}" width="${bw}" height="${h(d.plan)}" rx="5" fill="var(--fill-2)"/>`;
    if(d.act>0) g+=`<rect x="${x}" y="${y(d.act)}" width="${bw}" height="${h(d.act)}" rx="5" fill="var(--run)" opacity="${isCur?1:.85}"/>`;
    if(isCur) g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" style="fill:var(--label);font-weight:600">Now</text>`;
    else if(i%3===0) g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${shortDate(d.m)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly miles, planned and run">${g}</svg>`;
}
function lineChart(points, o){

  const W=640,H=210,L=6,R=84,T=14,B=38;
  const xs=points.map(p=>parse(p.x).getTime()); let x0=Math.min(...xs), x1=Math.max(...xs); if(x0===x1){x0-=3*864e5;x1+=3*864e5;}
  const ys=points.map(p=>p.y); let y0=Math.min(...ys), y1=Math.max(...ys); const py=(y1-y0)*.3||o.pad||5; y0-=py; y1+=py;
  const X=v=>L+(W-L-R)*((v-x0)/(x1-x0)), Y=v=> o.invert ? T+(H-T-B)*((v-y0)/(y1-y0)) : T+(H-T-B)*(1-(v-y0)/(y1-y0));
  let g=""; [y0+(y1-y0)*.15, (y0+y1)/2, y1-(y1-y0)*.15].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--sep)" stroke-dasharray="2 3"/><text x="${W-R+8}" y="${Y(v)+7}">${o.fmt(v)}</text>`; });
  const pts=points.map(p=>[X(parse(p.x).getTime()),Y(p.y)]), col=o.color||"var(--tint)", gid="g"+Math.random().toString(36).slice(2,7);

function viewRuns(){

  const easy=[...S.runs].filter(r=>r.avgHR&&r.avgHR<=cap+2&&pace(r)).sort((a,b)=>a.date.localeCompare(b.date)).map(r=>({x:r.date,y:pace(r)}));
  const longs=[...S.runs].filter(r=>r.long).sort((a,b)=>a.date.localeCompare(b.date)).map(r=>({x:r.date,y:r.miles}));

async function toJpeg(file){

    return await new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",.85)); }catch(_){ return null; }
}

/* ---------- personal bests and plate math ---------- */
/* A set is a best when its estimated max beats every earlier logged set of the same exercise (needs at least one earlier set, reps 12 or fewer). */
function bestBefore(id, date){ const base=String(id).split("~")[0]; let best=0;
  Object.values(S.liftlog).forEach(l=>{ if(!l.exercises||l.date>=date) return; l.exercises.forEach(x=>{ if(x.id!==id&&x.id!==base) return; x.sets.forEach(st=>{ if(st.done){ const v=e1rm(parseFloat(st.load),parseInt(st.reps)); if(v>best) best=v; } }); }); });
  const ld=S.loads.find(x=>x.id===base); (ld&&ld.history||[]).forEach(h=>{ if(h.date<date){ const v=e1rm(parseFloat(h.load),parseInt(h.reps)); if(v>best) best=v; } });
  return best; }
function isPR(ex, st){ const v=e1rm(parseFloat(st.load),parseInt(st.reps)); if(!v) return false; const b=bestBefore(ex.id, W.date);
  const today=Math.max(0,...ex.sets.filter(x=>x!==st&&x.done).map(x=>e1rm(parseFloat(x.load),parseInt(x.reps))||0));
  return b>0 && v>b+0.5 && v>today; }
const PLATES=[45,35,25,10,5,2.5];
function plateSplit(total, bar){ let side=(total-bar)/2; if(!(side>0)) return {side:Math.max(0,side), list:[], left:0}; const list=[]; for(const p of PLATES){ while(side>=p-1e-9){ list.push(p); side=Math.round((side-p)*100)/100; } } return {side:(total-bar)/2, list, left:side}; }
function barOf(e){ const base=S.loads.find(l=>l.id===String(e.id).split("~")[0])||e, pat=patOf(Object.assign({},base,{name:e.name})); if(!pat) return null;
  const n=String(e.name||"").toLowerCase(), o=(PAT[pat]||[]).find(x=>x[0].toLowerCase()===n)||(PAT[pat]||[]).find(x=>n.includes(x[0].toLowerCase()));
  if(!o||o[1]!=="bar") return null; return /smith/.test(n)?"smith":"barbell"; }
function platesOut(){ const tot=parseFloat(($("#plW")||{}).value), bar=+(($("#plBar")||{}).value||0), o=$("#plOut"); if(!o) return;
  if(!(tot>0)){ o.innerHTML='<div class="empty">Enter a weight</div>'; return; } const x=plateSplit(tot,bar);
  o.innerHTML = x.list.length? `<div class="plates">${x.list.map(p=>`<span class="pl" style="--h:${Math.round(34+p*0.9)}px">${p}</span>`).join("")}</div><div class="pltxt">Each side: ${x.list.join(" + ")}${x.left>0?` · ${x.left} lb short`:""}</div>` : `<div class="empty">Just the bar${x.left>0?` · ${x.left} lb a side short`:""}</div>`; }
function platesSheet(ei){ const ex=W.exercises[ei], st=ex.sets.find(x=>!x.done)||ex.sets[0]||{}, kind=barOf(ex); wPeek=true;
  sh.innerHTML = navBar(`<button class="nav-btn" type="button" data-w="peekclose">Back</button>`, "Plates", "") + `<div class="sh-body">
    <div class="hero"><div class="big">${esc(ex.name)}</div></div>
    <div class="group">${frow('<label for="plW">Weight (lb)</label>',`<input id="plW" inputmode="decimal" value="${esc(parseFloat(st.load)||"")}">`)}
    ${frow('<label for="plBar">The weight is</label>',`<select id="plBar"><option value="0" ${kind==="smith"?"selected":""}>Plates only</option><option value="45" ${kind!=="smith"?"selected":""}>With 45 lb bar</option></select>`)}</div>
    <div class="sec group" id="plOut" style="padding:16px"></div>
    <div class="foot">Your Smith machine numbers are plate totals. Plates: 45, 35, 25, 10, 5, 2.5.</div></div>`;
  platesOut(); sh.scrollTop=0; }

function patOf(e){ if(!e) return null; if(e.pattern&&PAT[e.pattern]) return e.pattern; const base=String(e.id||"").split("~")[0]; if(PMAP[base]) return PMAP[base];
  const n=String(e.name||"").toLowerCase();
  const rx=[[/speed .*squat|box jump|squat jump/,"pwrsquat"],[/bench|chest press|push-up/,"hpress"],[/pulldown|pull-up|chin-up/,"vpull"],[/explosive .*row/,"pwrrow"],[/row/,"hrow"],[/split squat|lunge/,"single"],[/squat|leg press/,"squat"],[/rdl|deadlift|back extension/,"hinge"],[/calf/,"calf"],[/adduct/,"adductor"],[/leg curl/,"hamcurl"],[/pallof|bird dog/,"antirot"],[/dead bug|plank|rollout|hollow/,"antiext"],[/chop|rotation/,"rotation"],[/pull-through|hip thrust|bridge/,"hipext"],[/carry/,"carry"],[/reverse fly|rear delt|pull-apart/,"reardelt"],[/lateral raise/,"latraise"],[/curl/,"biceps"],[/pushdown|triceps|skull/,"triceps"],[/shrug/,"shrug"],[/t\/y|y raise/,"lowtrap"],[/face pull/,"facepull"]];
  for(const [r,p] of rx) if(r.test(n)) return p; return null; }
const numLoad = s => { const m=String(s||"").match(/\d+(\.\d+)?/); return m?parseFloat(m[0]):null; };
function optFactor(pat,name){ const n=String(name||"").toLowerCase(); const o=(PAT[pat]||[]).find(x=>x[0].toLowerCase()===n)||(PAT[pat]||[]).find(x=>n.includes(x[0].toLowerCase())||x[0].toLowerCase().includes(n)); return o&&o[2]?o[2]:null; }
function refLoad(e,pat){ const f=optFactor(pat,e.name), n=numLoad(e.load); if(f&&n) return n/f;

  openSheet(navBar(navBtn("close","Close"), esc(longDate(d))+(p.week!=null?`<small>Week ${esc(p.week)}</small>`:""), "")+`<div class="sh-body">${h||'<div class="group"><div class="empty">Rest day. Recovery is training too.</div></div>'}</div>`); }

/* ---------- Health ---------- */
const dvals=(key,from,to)=>Object.values(S.daily).filter(d=>d.date>=from&&d.date<=to&&d[key]!=null&&d[key]!==""&&!isNaN(+d[key])).map(d=>+d[key]);
const mean=a=>a.length?sum(a)/a.length:null;
function trendOf(key, goodUp, t){ const rec=dvals(key,addDays(t,-13),t), base=dvals(key,addDays(t,-60),addDays(t,-14)), cur=mean(dvals(key,addDays(t,-6),t));
  if(rec.length<4||base.length<4) return {cur, st:null}; const r=mean(rec), b=mean(base), ch=(r-b)/(b||1);
  return {cur, diff:r-b, st: Math.abs(ch)<.02?"steady":((ch>0)===goodUp?"improving":"watch")}; }
function series(key,t,days){ return Object.values(S.daily).filter(d=>d.date>=addDays(t,-(days||90))&&d[key]!=null&&d[key]!==""&&!isNaN(+d[key])).sort((a,b)=>a.date.localeCompare(b.date)).map(d=>({x:d.date,y:+d[key]})); }
function pillarStatus(list){ const s=list.map(x=>x&&x.st).filter(Boolean); if(!s.length) return null; if(s.includes("watch")) return "watch"; if(s.includes("improving")) return "improving"; return "steady"; }
const stPill = s => s? `<span class="pill ${s==="improving"?"good":s==="watch"?"warn":"tint"}">${s==="improving"?"Improving":s==="watch"?"Watch":"Steady"}</span>` : '<span class="pill">Building baseline</span>';
const fmtN=(v,dp)=>v==null||isNaN(v)?"–":(+v).toFixed(dp||0);
const dTxt=(x,unit,dp)=>{ if(!x||x.cur==null) return "Syncs from your watch"; if(x.diff==null) return "7-day average"; const a=Math.abs(x.diff).toFixed(dp||0); return +a===0?"Steady":`${x.diff>0?"Up":"Down"} ${a}${unit}`; };
function liftE1(id){ const l=S.loads.find(x=>x.id===id); if(!l||!l.history) return null; const pts=l.history.map(h=>({x:h.date,y:e1rm(+h.load,+h.reps)})).filter(q=>q.y).sort((a,b)=>a.x.localeCompare(b.x)); return pts.length?{name:l.name, pts, last:pts[pts.length-1].y, first:pts[0].y}:null; }
function viewHealth(){
  const t=todayISO(), st=settings();
  const vo2=trendOf("vo2",true,t), rhr=trendOf("rhr",false,t), hrv=trendOf("hrv",true,t), slp=trendOf("sleep",true,t), wt=trendOf("weight",false,t), stp=trendOf("steps",true,t);
  const easy=[...S.runs].filter(r=>r.avgHR&&r.avgHR<=st.easyCap+2&&pace(r)).sort((a,b)=>a.date.localeCompare(b.date));
  const ep=easy.map(r=>({x:r.date,y:pace(r)/60}));
  let epSt=null; if(easy.length>=6){ const a=mean(easy.slice(-3).map(r=>pace(r))), b=mean(easy.slice(0,3).map(r=>pace(r))); const ch=(a-b)/b; epSt={st:Math.abs(ch)<.02?"steady":ch<0?"improving":"watch"}; }
  const lifts=["a1","b1","b3","a3","d3"].map(liftE1).filter(Boolean);
  let strSt=null; if(lifts.some(l=>l.pts.length>=3)){ const ch=mean(lifts.filter(l=>l.pts.length>=3).map(l=>(l.last-l.first)/l.first)); strSt={st:Math.abs(ch)<.02?"steady":ch>0?"improving":"watch"}; }
  const card=(icoCls,ico,title,status,nums,chart,why)=>`<div class="pillar"><div class="ph"><span class="ico ${icoCls}">${ico}</span><h3>${title}</h3>${stPill(status)}</div><div class="nums">${nums}</div>${chart}<div class="why">${why}</div></div>`;
  const num=(k,v,u,d)=>`<div class="num"><div class="k">${k}</div><div class="v">${v}${v==="–"||!u?"":`<small> ${u}</small>`}</div><div class="d">${d}</div></div>`;
  const chart=(pts,label,color,invert,dp)=>pts.length>=2?lineChart(pts,{label, color, invert, empty:"", fmt:v=>(+v).toFixed(dp||0)}):"";
  const rhrS=series("rhr",t), vo2S=series("vo2",t,180), hrvS=rolling(Object.values(S.daily).filter(d=>d.date>=addDays(t,-90)),"hrv",7), wtS=series("weight",t);
  const heart=card("run",ICON.heart,"Heart & Fitness",pillarStatus([vo2,rhr,epSt]),
    num("VO2 max",fmtN(vo2.cur,1),"",dTxt(vo2,"",1))+num("Resting HR",fmtN(rhr.cur),"bpm",dTxt(rhr," bpm"))+num("Easy pace",ep.length?fmtPace(pace(easy[easy.length-1])):"–","/mi",`At HR under ${st.easyCap}`)+num("Easy runs",easy.length,"","Logged so far"),
    chart(vo2S.length>=2?vo2S:rhrS, vo2S.length>=2?"VO2 max, last 6 months":"Resting heart rate, last 90 days", "var(--run)", vo2S.length<2, vo2S.length>=2?1:0),
    "Higher cardiorespiratory fitness is linked to longer life in large cohort studies (Mandsager et al., JAMA Netw Open, 2018). Lower resting HR over time usually means a fitter heart.");
  const rec=card("extra",ICON.rest,"Recovery",pillarStatus([hrv,slp]),
    num("HRV",fmtN(hrv.cur),"ms",dTxt(hrv," ms"))+num("Sleep",fmtN(slp.cur,1),"h",dTxt(slp," h",1)),
    chart(hrvS,"HRV 7-day average, last 90 days","#5856D6"),
    "HRV is read as a 7-day average, not day to day (Plews et al., Sports Med, 2013). Adults need 7 or more hours of sleep (Watson et al., Sleep, 2015).");
  const str=card("lift",ICON.lift,"Strength",strSt&&strSt.st?strSt.st:null,
    lifts.slice(0,4).map(l=>num(l.name.replace(/^Smith /,"").replace(/ bent-over/,""),Math.round(l.last),"lb",(l.last-l.first)>=1?`+${Math.round(l.last-l.first)} since ${shortDate(l.pts[0].x)}`:"Est. max")).join("")||num("Main lifts","–","","Log sets to start"),
    lifts.length&&lifts[0].pts.length>=2?lineChart(lifts[0].pts,{label:lifts[0].name+" estimated max",color:"var(--lift)",empty:"",fmt:v=>Math.round(v)}):"",
    "Greater muscle strength is linked to lower mortality in a 17-country cohort (Leong et al., Lancet, 2015). Estimated max uses the Epley formula from your best set.");
  const body=card("soc",ICON.body,"Body",pillarStatus([wt,stp]),
    num("Weight",fmtN(wt.cur,1),"lb",dTxt(wt," lb",1))+num("Steps",stp.cur==null?"–":Math.round(stp.cur).toLocaleString(),"/day",dTxt(stp,"",0)),
    chart(wtS,"Weight, last 90 days","var(--warn)",false,1),
    "Daily steps are linked to lower mortality, leveling off around 8,000 to 10,000 a day for adults under 60 (Paluch et al., Lancet Public Health, 2022).");
  const noWatch=!Object.values(S.daily).some(d=>d.rhr!=null||d.hrv!=null||d.sleep!=null||d.vo2!=null);
  const banner=noWatch?`<div class="callout" style="margin-top:4px"><div class="h">${ICON.heart} Waiting on your watch</div><p>Resting HR, HRV, sleep, VO2 max and steps arrive with the nightly sync from Health Auto Export. Trends appear after about two weeks.</p></div>`:"";
  return `<h1 class="large">Health</h1><div class="sub">Long-term trends from your watch and training</div>${banner}${heart}${rec}${str}${body}
  <div class="foot" style="padding-top:14px">Status compares the last 2 weeks with the 6 weeks before. Trends, not a diagnosis.</div>`;
}

/* ---------- goal suggestions ---------- */
const sugItems=()=>((S.goalSug&&S.goalSug.items)||[]).filter(x=>!x.state);
async function sugAct(id, add){ const all=[...((S.goalSug&&S.goalSug.items)||[])], it=all.find(x=>x.id===id); if(!it) return;
  it.state=add?"added":"dismissed"; it.decidedAt=todayISO();
  try{ if(add){ const items=[...((S.goals&&S.goals.items)||[]), {title:it.title, detail:it.detail||"", status:""}]; await db.doc("settings/goals").set(Object.assign({}, S.goals||{}, {items, updated:todayISO()})); }
    await db.doc("settings/goalSuggestions").set(Object.assign({}, S.goalSug||{}, {items:all})); toast(add?"Goal added":"Suggestion dismissed"); }catch(err){ failed(err); } }

/* ---------- drafts: keep what you typed if the app closes ---------- */
const DRAFT="fp-draft";
function draftSave(){ if(W||!dlg.open) return; const key=sh.dataset.key; if(!key) return; const v={};
  sh.querySelectorAll("input[id],textarea[id],select[id]").forEach(el=>{ if(el.type==="file") return; v[el.id]= el.type==="checkbox"? el.checked : el.value; });
  try{ localStorage.setItem(DRAFT, JSON.stringify({key, at:Date.now(), v})); }catch(_){} }
function draftRestore(){ let d=null; try{ d=JSON.parse(localStorage.getItem(DRAFT)||"null"); }catch(_){} if(!d||d.key!==sh.dataset.key||Date.now()-d.at>3*864e5) return;
  Object.entries(d.v).forEach(([id,val])=>{ const el=sh.querySelector("#"+CSS.escape(id)); if(!el) return; if(el.type==="checkbox") el.checked=!!val; else el.value=val; }); }
function draftClear(){ try{ localStorage.removeItem(DRAFT); }catch(_){} }

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const tb=e.target.closest(".tab"); if(tb){ if(tb.dataset.tab==="today") selDay=null; tab=tb.dataset.tab; try{localStorage.setItem("fp_tab",tab);}catch(_){} history.replaceState(null,"","#"+tab); render(); window.scrollTo(0,0); return; }
  const ld=e.target.closest("[data-lday]"); if(ld){ liftDay=ld.dataset.lday; render(); return; }
  const ps=e.target.closest("[data-pseg]"); if(ps){ planSeg=ps.dataset.pseg; render(); return; }
  const sd=e.target.closest("[data-sday]"); if(sd){ selDay=sd.dataset.sday===todayISO()?null:sd.dataset.sday; render(); return; }
  const fe=e.target.closest("[data-feel]"); if(fe){ feelDraft[fe.dataset.feel]=+fe.dataset.v; try{ localStorage.setItem("fp-feel", JSON.stringify({date:todayISO(), v:feelDraft})); }catch(_){} const grp=fe.parentElement; grp.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===fe)); return; }
  const rk=e.target.closest("[data-rk]"); if(rk){ reqDraft.kind=rk.dataset.rk; const t=$("#reqText"); if(t) reqDraft.text=t.value; reqForm(null,true); return; }
  const a=e.target.closest("[data-act]"); if(!a) return; const act=a.dataset.act;
  if(W && wPeek && act==="close"){ wPeek=false; dlg.className="full"; renderWorkout(); return; }
  if(W && sh.contains(a)){ if(act==="exinfo"){ wPeek=true; exSheet(a.dataset.id); dlg.className="full"; } return; }
  if(act==="close"){ draftClear(); return closeSheet(); }
  if(!db){ toast("Saving isn't available here"); return; }
  ({logrun:()=>runForm(a.dataset.d), logday:dayForm, loglift:liftForm, feelsave:saveFeel, runsheet:()=>runSheet(a.dataset.d), checkin:checkinSheet, rundetail:()=>runDetail(a.dataset.id), notfeeling:notFeelingSheet, nfsend:sendNotFeeling,
    nfpick:()=>{ nfPick=NF[+a.dataset.i]||""; sh.querySelectorAll('[data-act="nfpick"]').forEach(b=>b.setAttribute("aria-pressed", b===a)); }, ptslot:()=>ptSlotSheet(a.dataset.slot), updates:updList, checkins:checkinList, reqsave:saveReq,
    newreq:()=>reqForm(a.dataset.pre), attach:()=>$("#fileIn").click(), attdel:()=>{ const t=$("#reqText"); if(t) reqDraft.text=t.value; reqDraft.files.splice(+a.dataset.i,1); $("#attList").innerHTML=attHtml(); },
    gear:()=>gearSheet(a.dataset.id), gearsave:()=>saveGear(a.dataset.id), gearretire:()=>saveGear(a.dataset.id,true), ms:msSheet, mssave:saveMs, req:()=>reqSheet(a.dataset.id), upd:()=>updSheet(a.dataset.id), exinfo:()=>exSheet(a.dataset.id),
    goal:()=>goalSheet(a.dataset.i), goalsave:()=>saveGoal(a.dataset.i), goaldel:()=>saveGoal(a.dataset.i,true),
    daysheet:()=>daySheet(a.dataset.d), ptedit:()=>{ if(dlg.open) draftClear(); ptEditSheet(); }, ptitem:()=>ptItemSheet(a.dataset.i), ptitemsave:()=>ptItemSave(a.dataset.i), ptitemdel:()=>ptItemSave(a.dataset.i,true), ptex:()=>ptExSheet(a.dataset.id), ptexsave:()=>ptExSave(a.dataset.id), ptexdel:()=>ptExSave(a.dataset.id,true), ptinc:()=>ptInc(a.dataset.id), sugadd:()=>sugAct(a.dataset.id,true), sugno:()=>sugAct(a.dataset.id,false),
    altreq:()=>{ const x=exAlt[+a.dataset.k]; if(!x||!exAltFor) return; save(db.collection("requests").doc(Date.now().toString(36)), {created:new Date().toISOString(), kind:"change", status:"pending", reply:"", attachments:[], text:`Swap ${exAltFor.name} for ${x.name} going forward (${x.load} · ${x.scheme}). Equipment.`}, "Swap requested. Reviewed tonight."); },
    signout:()=>FP.signOut(), liftsheet:()=>liftSheet(a.dataset.day), workout:()=>startWorkout(a.dataset.day||"A")}[act]||(()=>{}))();
});
$("#fileIn").addEventListener("change",e=>{ const fs=[...e.target.files]; e.target.value=""; if(fs.length&&assets) addFiles(fs); });
$("#logBtn").addEventListener("click",()=>{ if(!db){ toast("Saving isn't available here"); return; } chooser(); });
dlg.addEventListener("click",e=>{ if(e.target===dlg&&!W) closeSheet(); });
dlg.addEventListener("cancel",e=>{ if(W){ e.preventDefault(); grabNotes(); wPause(); persistWorkout(); endWorkout("Paused and saved. Tap Resume Workout to continue."); } });
window.addEventListener("hashchange",()=>{ const h=routeTab(location.hash.slice(1)); if(h){ tab=h; render(); } });

/* ---------- data ---------- */
(async function boot(){
  render();
  if(!FP.ready){ $("#view").innerHTML='<h1 class="large">Today</h1><div class="group"><div class="empty">Couldn\'t load. Check your connection and reopen the app.</div></div>'; return; }
  const sess = await FP.session();
  if(!sess){ FP.showAuth(()=>location.reload()); return; }
  db = FP.makeDb(sess.user.id); assets = FP.makeAssets(sess.user.id); FP.onUrl = queue;
  const timer=setTimeout(()=>{ if(!S.loaded) toast("Still loading. Data may be out of date."); },10000);
  let reopened=false;
  const mark=s=>{ if(!s.metadata.fromCache){ S.loaded=true; clearTimeout(timer); } queue();
    if(!reopened&&S.loaded&&S.loads.length){ reopened=true; let d=null; try{ d=localStorage.getItem("fp-w-open"); }catch(_){} const loc=wLocal(); if(d&&loc&&loc.date===todayISO()&&loc.status==="in_progress"&&!W) setTimeout(()=>startWorkout(d),50); } };
  const err=()=>{ S.loaded=true; clearTimeout(timer); queue(); };
  const byDate=(s,k)=>{ S[k]={}; s.docs.forEach(d=>{ const v=d.data(); S[k][v.date||d.id]=v; }); };
  db.collection("plan").onSnapshot(s=>{ byDate(s,"plan"); mark(s); },err);
  db.collection("runs").onSnapshot(s=>{ S.runs=s.docs.map(d=>Object.assign({id:d.id},d.data())); mark(s); },err);
  db.collection("loads").onSnapshot(s=>{ S.loads=s.docs.map(d=>Object.assign({id:d.id},d.data())); mark(s); },err);
  db.collection("liftlog").onSnapshot(s=>{ byDate(s,"liftlog"); mark(s); },err);
  db.collection("daily").onSnapshot(s=>{ byDate(s,"daily"); mark(s); },err);
  db.doc("settings/main").onSnapshot(d=>{ S.settings=d.exists?d.data():{}; queue(); },()=>{});
  db.doc("settings/gear").onSnapshot(d=>{ S.gear=d.exists?d.data():null; queue(); },()=>{});
  db.doc("settings/milestones").onSnapshot(d=>{ S.milestones=d.exists?d.data():null; queue(); },()=>{});
  db.collection("requests").onSnapshot(s=>{ S.requests=s.docs.map(d=>Object.assign({id:d.id},d.data())); queue(); },()=>{});
  db.collection("updates").onSnapshot(s=>{ S.updates=s.docs.map(d=>Object.assign({id:d.id},d.data())); queue(); },()=>{});
  db.doc("settings/goals").onSnapshot(d=>{ S.goals=d.exists?d.data():null; queue(); },()=>{});
  db.doc("settings/goalSuggestions").onSnapshot(d=>{ S.goalSug=d.exists?d.data():null; queue(); },()=>{});
  db.doc("settings/ptDaily").onSnapshot(d=>{ S.ptDaily=d.exists?d.data():null; queue(); },()=>{});
  db.start();
})();
})();
